name: MinefortAntiBot
main: com.minefart.antibot.MinefortAntiBotPlugin
version: 1.1.2
author: void1z
description: blocks known raid bot usernames before they join
commands:
  minefortantibot:
    description: anti-bot status, reload and plugin info
    aliases: [mab]
    usage: /mab [status|reload|plugin]
permissions:
  minefortantibot.admin:
    description: lets staff reload the database
    default: op
  minefortantibot.alerts:
    description: shows compact raid alerts
    default: op
