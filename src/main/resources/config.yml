# exact usernames | normal Java names plus + offline names and . Bedrock names
database-url: "https://raw.githubusercontent.com/void1z2/minefort-antibot/main/database.txt"

# check for new names every minute
update-minutes: 1

# checks the GitHub releases page for a newer plugin version
check-updates: true
update-check-hours: 12

blocked-message: "&cminefart antibot &8| &7access denied"

raid:
  minimum-known-accounts: 3
  window-seconds: 40
  incident-seconds: 60

# Kixae only links a server after it has joined that exact server
v3:
  base-url: "https://minef.art"
  allow-http: false
  verifier-name: "Kixae"
